<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple JavaScript Calculator</title>
    <link rel="stylesheet" href="calculator/style.css" />
  </head>
  <body>
    <div class="calculator">
      <!-- Display text input area, read-only to prevent typing -->
      <input type="text" id="calDisplay" readonly placeholder="0" />
      <input type="text" id="display" />

      <!-- Keypad buttons container -->
      <div class="buttons">
        <button class="btn clear">C</button>
        <button class="btn operator">/</button>
        <button class="btn operator">*</button>
        <button class="btn operator">-</button>
        <button id="delete"><</button>

        <button class="btn num">7</button>
        <button class="btn num">8</button>
        <button class="btn num">9</button>
        <button class="btn operator">+</button>

        <button class="btn num">4</button>
        <button class="btn num">5</button>
        <button class="btn num">6</button>
        <button class="btn equal">=</button>

        <button class="btn num">1</button>
        <button class="btn num">2</button>
        <button class="btn num">3</button>
        <button class="btn num">0</button>
        <button id="dot">.</button>
      </div>
    </div>

    <script src="calculator/Calculator.js"></script>
  </body>
</html>
